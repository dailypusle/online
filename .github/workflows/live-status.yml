
name: Update DailyPulse Live TV Status

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: dailypulse-live-status
  cancel-in-progress: false

jobs:
  check-live-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp

      - name: Check YouTube live channels
        run: python scripts/check_live.py

      - name: Commit and push updated live status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "No live status changes to commit."
            exit 0
          fi

          git commit -m "Update DailyPulse live TV status"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
