name: Update aggregated news feeds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-feeds
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate aggregated news feeds
        run: |
          python scripts/fetch_news.py

      - name: Commit and push updated feeds
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"

          git add feeds/

          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi

          git commit -m "Update aggregated news feeds"

          git pull --rebase origin main

          git push origin main
