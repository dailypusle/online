<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087cf0">
<meta name="description" content="DailyPulse brings you the latest breaking news, top stories, business, technology, sports and world updates.">
<meta name="application-name" content="DailyPulse">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DailyPulse">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DailyPulse">
<meta property="og:title" content="DailyPulse — Latest News">
<meta property="og:description" content="News that keeps you in the know. Get the latest top stories and breaking news with DailyPulse.">
<meta property="og:image" content="icons/dailypulse-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="DailyPulse — Latest News">
<meta name="twitter:description" content="News that keeps you in the know.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>DailyPulse — Latest News</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
};

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
:root{--blue:#087cf0;--blue-dark:#075ed1;--ink:#10284e;--muted:#667c99;--line:#dceafa;--pale:#eaf4ff;--card:#fff;--bg:#f8fbff;--shadow:0 8px 28px rgba(24,83,143,.07)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1240px;margin:auto;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:1.7rem;font-weight:850;letter-spacing:-.06em;white-space:nowrap}
.brand-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#0796ff,#1455ed);box-shadow:0 4px 10px #087cf033}
.brand-icon svg{width:31px;height:31px}
.brand-name{color:var(--ink)}
.brand-name span{color:var(--blue)}
.nav{display:flex;align-items:center;gap:30px}
.nav a{font-size:.94rem;font-weight:650;text-decoration:none;color:#203858;padding:8px 0;border-bottom:2px solid transparent}
.nav a.active,.nav a:hover{color:var(--blue);border-color:var(--blue)}
.header-actions{display:flex;align-items:center;gap:10px}
button{font:inherit;cursor:pointer}
.refresh{border:1px solid #cfe3fb;background:white;color:var(--blue-dark);font-weight:700;padding:9px 15px;border-radius:10px}
.refresh:hover{background:var(--pale)}
.install-app{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:linear-gradient(135deg,#087cf0,#075ed1);color:#fff;font-weight:750;padding:10px 14px;border-radius:10px;box-shadow:0 4px 12px #087cf02b;white-space:nowrap}
.install-app:hover{filter:brightness(1.06);transform:translateY(-1px)}
.install-app[hidden]{display:none!important}
.install-app svg{width:17px;height:17px;flex:none}
.install-app:focus-visible{outline:3px solid #087cf055;outline-offset:2px}
@media(max-width:760px){.install-app{padding:8px 10px;font-size:.82rem;gap:5px}.install-app svg{width:15px;height:15px}}
@media(max-width:380px){.install-app{padding:7px 8px;font-size:.75rem}}
.menu-toggle{display:none;border:0;background:transparent;color:var(--ink);font-size:1.7rem;padding:3px 8px}

/* Live cryptocurrency ticker */
.crypto-ticker{width:100%;overflow:hidden;background:#eff6ff;color:#10284e;border-top:1px solid #dceafa;border-bottom:1px solid #c7defa;white-space:nowrap}
.crypto-ticker-track{display:flex;width:max-content;align-items:center;min-height:44px;animation:crypto-ticker-scroll 42s linear infinite}
.crypto-ticker:hover .crypto-ticker-track{animation-play-state:paused}
.crypto-ticker-item{display:inline-flex;align-items:center;gap:8px;padding:7px 20px;border-right:1px solid #d7e8fc;font-size:12px;font-weight:750}
.crypto-ticker-icon{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#fff;border:1px solid #bfdbfe;color:#087cf0;font-size:14px}
.crypto-ticker-symbol{color:#087cf0;letter-spacing:.35px}
.crypto-ticker-price{color:#10284e}
.crypto-ticker-change{font-size:11px}
.crypto-ticker-change.up{color:#15803d}
.crypto-ticker-change.down{color:#dc2626}
.crypto-ticker-status{padding:8px 18px;color:#087cf0;font-size:12px;font-weight:700}
@keyframes crypto-ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.crypto-ticker-track{animation:none}}

main{max-width:1240px;margin:0 auto;padding:24px 26px 48px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:4px 1px 16px;scrollbar-width:thin}
.category{flex:0 0 auto;border:1px solid #d5e7fb;background:#fff;color:#486482;border-radius:999px;padding:8px 15px;font-weight:650;font-size:.88rem;white-space:nowrap}
.category[aria-pressed="true"]{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 4px 10px #087cf02b}
.category:hover{border-color:var(--blue);color:var(--blue)}
.category[aria-pressed="true"]:hover{color:white}
#status{min-height:24px;color:var(--muted);font-size:.86rem;margin:0 0 12px}
#news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.story{min-width:0;display:grid;grid-template-columns:minmax(150px,38%) minmax(0,1fr);align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 7px #173b6205;transition:transform .18s ease,box-shadow .18s ease}
.story:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.story .photo{display:block;width:100%;height:100%;min-height:205px;object-fit:cover;background:#e6f0fb}
.story .text{padding:20px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.story h2{font-size:1.08rem;line-height:1.35;letter-spacing:-.02em;margin:0 0 10px}
.story h2 a{text-decoration:none}
.story h2 a:hover{color:var(--blue)}
.meta{color:var(--muted);font-size:.78rem;line-height:1.5}
.description{margin:12px 0 0;color:#58708f;font-size:.9rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.read-more{display:inline-flex;align-items:center;gap:8px;margin-top:auto;padding-top:14px;text-decoration:none;color:var(--blue-dark);font-weight:750;font-size:.9rem}
.read-more:hover{gap:12px}
.story:not(:has(.photo)){grid-template-columns:1fr}
.error{grid-column:1/-1;background:white;border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--muted);overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:.84rem;padding:24px;text-align:center}
footer strong{color:var(--ink)}
@media(min-width:1000px){#news{grid-template-columns:1fr 1fr}.story{min-height:220px}}
@media(max-width:760px){
.header-inner{padding:11px 16px;gap:10px}
.brand{font-size:1.35rem;gap:8px}
.brand-icon{width:36px;height:36px}
.brand-icon svg{width:27px;height:27px}
.menu-toggle{display:block}
.nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;padding:12px 18px 18px;border-bottom:1px solid var(--line);box-shadow:var(--shadow);flex-direction:column;align-items:stretch;gap:2px}
.nav.open{display:flex}
.nav a{padding:10px 8px;border-bottom:0;border-radius:8px}
.nav a.active,.nav a:hover{background:var(--pale)}
.refresh{padding:8px 11px;font-size:.84rem}
main{padding:16px 14px 32px}
#news{grid-template-columns:1fr;gap:12px}
.story{display:flex;flex-direction:column;border-radius:14px}
.story .photo{width:100%;height:auto;aspect-ratio:16/9;min-height:0}
.story .text{padding:15px 16px 17px}
.story h2{font-size:1.04rem;margin-bottom:8px}
.description{font-size:.9rem;-webkit-line-clamp:3;margin-top:9px}
.read-more{padding-top:11px}
.categories{gap:7px;padding-bottom:12px}
.category{padding:7px 12px;font-size:.83rem}
#status{font-size:.82rem}
.story:not(:has(.photo)){display:block}
}
@media(max-width:380px){.brand{font-size:1.2rem}.brand-icon{width:32px;height:32px}.refresh{font-size:.78rem;padding:7px 8px}}

/* DailyPulse Assistant */
#dp-chat-launcher{position:fixed;right:22px;bottom:22px;z-index:1001;width:62px;height:62px;border:0;border-radius:50%;background:#087cf0;color:#fff;box-shadow:0 6px 20px #087cf044;display:grid;place-items:center;cursor:pointer}
#dp-chat-launcher svg{width:36px;height:36px}
#dp-chat-panel{position:fixed;right:22px;bottom:96px;z-index:1000;width:min(430px,calc(100vw - 28px));height:min(680px,calc(100dvh - 118px));background:#fff;border:1px solid #d8e8fa;border-radius:20px;box-shadow:0 12px 42px #173b6222;display:none;overflow:hidden;flex-direction:column;color:#10284e}
#dp-chat-panel.open{display:flex}
.dp-chat-head{background:#087cf0;color:#fff;padding:15px 17px;display:flex;align-items:center;gap:12px;flex:none}
.dp-chat-logo{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.dp-chat-logo svg{width:29px;height:29px}
.dp-chat-head-copy{min-width:0;flex:1}
.dp-chat-head-copy strong{display:block;font-size:1.02rem;font-weight:750}
.dp-chat-head-copy span{display:block;font-size:.82rem;opacity:.94}
.dp-chat-close{border:0;background:transparent;color:#fff;font-size:27px;line-height:1;padding:3px 7px;cursor:pointer}
.dp-chat-body{padding:16px 14px;overflow-y:auto;flex:1;background:#f8fbff;scroll-behavior:smooth}
.dp-chat-welcome,.dp-chat-message{display:flex;gap:9px;align-items:flex-start;margin:0 0 14px}
.dp-chat-avatar{width:34px;height:34px;border-radius:50%;background:#087cf0;color:#fff;display:grid;place-items:center;flex:none;font-size:19px}
.dp-chat-bubble{max-width:calc(100% - 43px);background:#fff;border:1px solid #e1ebf7;border-radius:15px;padding:12px 14px;font-size:.92rem;line-height:1.58;overflow-wrap:anywhere;box-shadow:0 2px 7px #173b6208}
.dp-chat-message.user{justify-content:flex-end}
.dp-chat-message.user .dp-chat-bubble{background:#e6f2ff;border-color:#d4e8ff;color:#12345b;border-bottom-right-radius:5px;max-width:86%}
.dp-chat-message.assistant .dp-chat-bubble{border-bottom-left-radius:5px}
.dp-chat-bubble p{margin:0 0 10px}
.dp-chat-bubble p:last-child{margin-bottom:0}
.dp-chat-bubble hr{border:0;border-top:1px solid #cbd9e8;margin:12px 0;width:100%}
.dp-chat-bubble h2,.dp-chat-bubble h3{font-size:1rem;line-height:1.35;margin:12px 0 7px;color:#10284e}
.dp-chat-bubble ul,.dp-chat-bubble ol{margin:6px 0 11px;padding-left:22px}
.dp-chat-bubble li{margin:4px 0}
.dp-chat-bubble strong{font-weight:750;color:#17365f}
.dp-chat-bubble mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.dp-chat-bubble mjx-container[display="true"]{margin:12px 0!important;padding:4px 0}
.dp-chat-bubble a,.dp-chat-source a{color:#0874e8;font-weight:750;text-decoration:none;overflow-wrap:anywhere}
.dp-chat-bubble a:hover,.dp-chat-source a:hover{text-decoration:none;color:#0758bd}
.dp-chat-sources{margin:10px 0 2px;padding-top:10px;border-top:1px solid #e6eef8}
.dp-chat-sources-title{font-size:.8rem;font-weight:750;color:#71839b;margin-bottom:7px}
.dp-chat-source{padding:9px 10px;margin:7px 0;background:#f1f7ff;border:1px solid #e0edfb;border-radius:11px}
.dp-chat-source a{display:block;font-size:.88rem;line-height:1.4}
.dp-chat-source small{display:block;color:#8091a8;font-size:.75rem;margin-top:4px}
.dp-chat-suggestions{display:grid;gap:7px;margin:0 0 12px 43px}
.dp-chat-suggestion{border:1px solid #d5e7fb;background:#fff;color:#0872e5;border-radius:11px;padding:9px 11px;text-align:left;font-size:.83rem;font-weight:650;cursor:pointer}
.dp-chat-suggestion:hover{background:#edf6ff}
.dp-chat-compose{border-top:1px solid #e3edf8;background:#fff;padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex:none}
.dp-chat-input{min-width:0;flex:1;min-height:47px;max-height:180px;overflow-y:auto;resize:none;box-sizing:border-box;border:1px solid #d8e6f5;border-radius:22px;padding:13px 15px;font:inherit;font-size:.92rem;line-height:1.4;color:#10284e;outline:none}
.dp-chat-input:focus{border-color:#78b8ff;box-shadow:0 0 0 3px #087cf014}
.dp-chat-send{width:47px;height:47px;border:0;border-radius:50%;background:#087cf0;color:#fff;font-size:21px;flex:none;cursor:pointer}
.dp-chat-send:disabled{opacity:.55;cursor:wait}
.dp-chat-foot{text-align:center;background:#fff;color:#8293a9;font-size:.74rem;padding:0 10px 10px;flex:none}
.dp-chat-foot b{color:#087cf0}
.dp-chat-typing{color:#7890ad;font-size:.82rem;padding:4px 0 12px 43px}
@media(max-width:520px){
#dp-chat-launcher{right:15px;bottom:16px;width:57px;height:57px}
#dp-chat-panel{right:10px;bottom:82px;width:calc(100vw - 20px);height:min(690px,calc(100dvh - 96px));border-radius:18px}
.dp-chat-head{padding:13px}
.dp-chat-body{padding:13px 11px}
.dp-chat-bubble{font-size:.9rem}
}

/* Ask AI action */
.story-heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;width:100%;margin:0 0 9px}
.story-heading-row h2{flex:1;min-width:0;margin:0;overflow-wrap:anywhere}
.story-ask-ai{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:0 0 auto;border:1px solid #c9e2ff;border-radius:999px;background:#eef7ff;color:#0874e8;padding:8px 12px;font-size:.82rem;font-weight:750;line-height:1;white-space:nowrap;box-shadow:0 2px 7px #087cf012;transition:background .15s,border-color .15s,transform .15s}
.story-ask-ai svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.story-ask-ai:hover{background:#dceeff;border-color:#8fc5ff;transform:translateY(-1px)}
.story-ask-ai:focus-visible{outline:3px solid #087cf055;outline-offset:2px}
@media(max-width:760px){.story-heading-row{gap:9px}.story-heading-row h2{font-size:1.02rem}.story-ask-ai{padding:7px 10px;font-size:.78rem}.story-ask-ai svg{width:17px;height:17px}}
@media(max-width:360px){.story-heading-row{flex-wrap:wrap}.story-ask-ai{margin-left:auto}}

/* Assistant response actions */
.dp-chat-response-content{position:relative;flex:1;min-width:0;max-width:calc(100% - 43px)}
.dp-chat-response-content .dp-chat-bubble{max-width:100%;width:100%;box-sizing:border-box;padding-top:48px}
.dp-message-actions{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:center;gap:7px;margin:0}
.dp-message-action{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #dce8f5;border-radius:50%;background:#fff;color:#087cf0;cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.045)}
.dp-message-action svg{width:17px;height:17px;display:block}
.dp-message-action:hover{background:#eaf4ff;border-color:#b9d9ff}
.dp-message-action:focus-visible{outline:3px solid #087cf044;outline-offset:2px}
.dp-message-action:disabled{opacity:.6;cursor:default}
</style>
</head>
